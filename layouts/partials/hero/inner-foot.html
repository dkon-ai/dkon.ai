<script>
  document.querySelector('.sky-toggle')?.addEventListener('click', function () {
    var r = document.documentElement, next = r.getAttribute('data-sky') === 'slate' ? 'paper' : 'slate';
    r.setAttribute('data-sky', next); localStorage.setItem('dkon-sky', next);
  });
</script>
